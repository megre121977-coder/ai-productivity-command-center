[project]
name = "ai-productivity-command-center"
version = "0.1.0"
description = "A public-safe AI productivity dashboard for prioritization, summaries and executive briefs."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
